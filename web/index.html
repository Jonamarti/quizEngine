<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <div class="cabecera-inner">
      <h1 id="cabecera-titulo">Quiz</h1>
      <p id="cabecera-sub"></p>
    </div>
  </header>

  <main id="app">

    <section id="vista-listado" class="vista activa">
      <div id="lista-examenes"></div>
    </section>

    <section id="vista-generador" class="vista">
      <div id="panel-generador"></div>
    </section>

    <section id="vista-examen" class="vista">
      <div id="barra-examen" class="barra-examen"></div>
      <div class="layout-examen">
        <nav id="navegador-preguntas" class="navegador"></nav>
        <div id="contenedor-preguntas" class="contenedor-preguntas"></div>
      </div>
    </section>

    <section id="vista-resultados" class="vista">
      <div id="contenedor-resultados"></div>
    </section>

  </main>

  <div id="modal" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-caja">
      <h2 id="modal-titulo"></h2>
      <div id="modal-mensaje"></div>
      <div id="modal-acciones" class="modal-acciones"></div>
    </div>
  </div>

  <!-- DATOS_DEL_TEMA -->

  <script src="js/textos.js"></script>
  <script src="js/persistencia.js"></script>
  <script src="js/banco.js"></script>
  <script src="js/examen.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/vista-listado.js"></script>
  <script src="js/vista-generador.js"></script>
  <script src="js/vista-examen.js"></script>
  <script src="js/vista-resultados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
